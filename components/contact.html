<!-- Contact Me -->
<section class="contact section" id="contact">
    <h2 class="section__title">
        Contact Me
    </h2>

    <span class="section__subtitle">
        Let's connect and build something together
    </span>

    <div class="contact__container container">
        <div class="contact__grid">
            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/mhdhamka" target="_blank" rel="noopener noreferrer" class="contact__card">
                <div class="contact__icon">
                    <i class="uil uil-linkedin"></i>
                </div>

                <div class="contact__content">
                    <span class="contact__type">
                        Professional Network
                    </span>

                    <h3>
                        LinkedIn
                    </h3>

                    <p>
                        Mohd Hamka
                    </p>
                </div>

                <i class="uil uil-arrow-up-right contact__arrow"></i>
            </a>

            <!-- GitHub -->
            <a href="https://github.com/mhdhamka" target="_blank" rel="noopener noreferrer" class="contact__card">
                <div class="contact__icon">
                    <i class="uil uil-github"></i>
                </div>

                <div class="contact__content">
                    <span class="contact__type">
                        Developer Portfolio
                    </span>

                    <h3>
                        GitHub
                    </h3>

                    <p>
                        mhdhamka
                    </p>
                </div>
                <i class="uil uil-arrow-up-right contact__arrow"></i>
            </a>

            <!-- Email with Interactive Copy-to-Clipboard (Symmetrical Titles) -->
            <div class="contact__card email-copy-wrapper" onclick="copyEmailToClipboard()" role="button" tabindex="0" aria-label="Copy email address">
                <div class="contact__icon">
                    <i class="uil uil-envelope"></i>
                </div>

                <div class="contact__content">
                    <span class="contact__type">
                        Direct Contact
                    </span>

                    <h3>
                        Gmail
                    </h3>

                    <p id="email-text">
                        m.hamka017@gmail.com
                    </p>
                </div>

                <i class="uil uil-copy contact__arrow"></i>

                <!-- Modern Stardust Tooltip -->
                <span class="copy-tooltip" id="email-tooltip">Copied to clipboard!</span>
            </div>
        </div>
    </div>
</section>
