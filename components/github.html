<!-- GitHub Activity -->
<section class="github section" id="github">

    <h2 class="section__title">
        GitHub Activity
    </h2>

    <span class="section__subtitle">
        My coding journey and open-source contributions
    </span>

    <div class="github__container container">

        <!-- Modernized Profile Header with Status Pill -->
        <div class="github__profile-header">
            <div class="github__avatar-wrapper">
                <img src="https://github.com/mhdhamka.png" alt="mhdhamka avatar" class="github__avatar">
                <span class="github__status-dot" title="Active Developer"></span>
            </div>
            <div class="github__profile-info">
                <div class="github__profile-title-row">
                    <h3>mhdhamka</h3>
                    <span class="github__badge-pill"><i class="uil uil-code-branch"></i> Open Source</span>
                </div>
                <p>Building scalable web apps, full-stack systems, and exploring AI integration.</p>
            </div>
        </div>

        <!-- Main Stats & Languages Grid -->
        <div class="github__stats-grid">
            <div class="github__card-wrapper">
                <img 
                    src="https://github-readme-stats-eight-theta.vercel.app/api?username=mhdhamka&show_icons=true&theme=tokyonight&hide_border=true&count_private=true"
                    alt="GitHub Stats"
                    class="github__stats"
                >
            </div>

            <div class="github__card-wrapper">
                <img 
                    src="https://github-readme-stats-eight-theta.vercel.app/api/top-langs/?username=mhdhamka&layout=compact&theme=tokyonight&hide_border=true"
                    alt="Top Languages"
                    class="github__stats"
                >
            </div>
        </div>

        <!-- Streak Card Full-Width Container -->
        <div class="github__streak-container">
            <img 
                src="https://github-readme-streak-stats.herokuapp.com/?user=mhdhamka&theme=tokyonight&hide_border=true&background=0D1117"
                alt="GitHub Streak"
                class="github__stats github__streak"
            >
        </div>

    </div>

    <!-- Contribution Graph / Snake Animation Box -->
    <div class="github-calendar container">
        <div class="github-calendar__header">
            <span> Contribution Timeline Matrix</span>
        </div>
        <img 
            src="https://raw.githubusercontent.com/mhdhamka/mhdhamka/output/github-contribution-grid-snake-dark.svg"
            alt="GitHub Contribution Snake"
            class="github__snake"
        >
    </div>

    <div class="github__button">
        <a href="https://github.com/mhdhamka"
           target="_blank"
           rel="noopener noreferrer"
           class="button button--flex">
            View My GitHub Profile
            <i class="uil uil-github button__icon"></i>
        </a>
    </div>

</section>
